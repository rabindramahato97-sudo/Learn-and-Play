<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1597e5"><link rel="manifest" href="manifest.json"><title>Learn & Play</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(#dff8ff,#f7fff1);color:#14243b}.app{max-width:720px;margin:auto;padding:18px 15px 35px}header{display:flex;justify-content:space-between;align-items:center}.logo{font-size:38px;line-height:.9;font-weight:900;color:#1187d0}.stats{background:#fff1a8;border-radius:22px;padding:10px 16px;font-weight:800;text-align:center}.card{background:#fff;border-radius:28px;padding:20px;margin-top:16px;box-shadow:0 7px 22px #0001}h1{margin:0 0 5px}.muted{color:#617083}input,select,button{font:inherit}input,select{width:100%;padding:13px;border:2px solid #dce7ef;border-radius:15px;margin:7px 0 12px}button{border:0;border-radius:16px;padding:14px;font-weight:800}.primary{background:#1289d6;color:#fff;width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.subject{height:125px;font-size:20px}.subject b{font-size:32px}.math{background:#ffd0d9}.eng{background:#cfe7ff}.hin{background:#ffe2ad}.evs{background:#d8f5bd}.gk{background:#e7d5ff}.row{display:flex;gap:10px}.row>*{flex:1}.hidden{display:none}.q{font-size:25px;font-weight:850;text-align:center;margin:20px 0}.answers{display:grid;gap:10px}.ans{background:#f2f7fb;border:2px solid #e0e9ef;text-align:left}.correct{background:#c9f3d8!important;border-color:#1b9b5d!important}.wrong{background:#ffd1d1!important;border-color:#d54b4b!important}.feedback{text-align:center;min-height:30px;font-weight:800}.bar{height:11px;background:#e9eef2;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#20a463}.badge{display:inline-block;background:#fff1a8;padding:8px 12px;border-radius:99px;margin:4px}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.level{background:#edf5fa}.locked{opacity:.45}footer{text-align:center;color:#718096;font-size:12px;margin-top:16px}
</style></head><body><main class="app"><header><div class="logo">Learn<br>& Play</div><div class="stats">⭐ <span id="stars">0</span><br>🪙 <span id="coins">0</span></div></header>
<section id="home" class="card"><h1>👋 Welcome!</h1><div class="muted">खेलते-खेलते सीखें</div><div class="card"><label>👦 बच्चे का नाम</label><input id="name" placeholder="नाम लिखें"><label>🎒 कक्षा</label><select id="grade"><option>Nursery</option><option>LKG</option><option>UKG</option><option>Class 1</option><option>Class 2</option><option>Class 3</option><option>Class 4</option><option>Class 5</option></select><button class="primary" onclick="saveProfile()">Start Learning 🚀</button></div><div id="welcome" class="muted"></div><div class="grid"><button class="subject math" onclick="start('Maths')"><b>🔢</b>Maths</button><button class="subject eng" onclick="start('English')"><b>🔤</b>English</button><button class="subject hin" onclick="start('Hindi')"><b>🪔</b>हिन्दी</button><button class="subject evs" onclick="start('EVS')"><b>🌱</b>EVS</button><button class="subject gk" onclick="start('GK')"><b>🌍</b>GK</button></div></section>
<section id="quiz" class="card hidden"><div class="row"><button onclick="home()">← Home</button><div><b id="title"></b> &nbsp; ❤️ <span id="lives">3</span></div></div><div class="bar"><div id="fill" class="fill"></div></div><div id="q" class="q"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><button id="next" class="primary hidden" onclick="next()">Next ➜</button></section>
<section id="result" class="card hidden"><h1>🎉 बहुत बढ़िया!</h1><p id="resultText"></p><div id="badges"></div><button class="primary" onclick="home()">🏠 Home</button></section>
<section id="progress" class="card"><h1>🏆 Progress</h1><p class="muted">4 या अधिक सही उत्तर पर अगला level unlock होगा।</p><div id="levels" class="levels"></div></section><footer>Learn & Play • Kids Educational Game</footer></main>
<script>
const D={Maths:[['2 + 3 = ?',['4','5','6','7'],'5'],['5 - 2 = ?',['2','3','4','5'],'3'],['3 × 2 = ?',['5','6','7','8'],'6'],['10 ÷ 2 = ?',['2','5','8','10'],'5'],['Which is bigger?',['7','3','5','2'],'7'],['4 + 4 = ?',['6','7','8','9'],'8']],English:[['Opposite of big?',['small','tall','fast','hot'],'small'],['Plural of cat?',['cats','catss','cates','cat'],'cats'],['A,E,I,O,U are…',['numbers','vowels','colors','shapes'],'vowels'],['Which is a fruit?',['Apple','Chair','Book','Ball'],'Apple'],['I ___ a student.',['am','is','are','be'],'am'],['Opposite of day?',['light','night','sun','morning'],'night']],Hindi:[['“बड़ा” का विलोम?',['छोटा','लंबा','ऊँचा','भारी'],'छोटा'],['“जल” का अर्थ?',['आग','पानी','हवा','मिट्टी'],'पानी'],['अ से कौन-सा शब्द?',['अनार','कमल','गमला','मछली'],'अनार'],['गाय हमें क्या देती है?',['दूध','पानी','रस','चाय'],'दूध'],['एक के बाद?',['दो','तीन','चार','पाँच'],'दो'],['हम लिखने के लिए?',['पेंसिल','जूता','कप','गेंद'],'पेंसिल']],EVS:[['Plants need what?',['Sunlight','TV','Shoes','Toys'],'Sunlight'],['We breathe in…',['Oxygen','Stone','Sand','Wood'],'Oxygen'],['Source of water?',['River','Chair','Road','Book'],'River'],['Earth is our…',['Home','Car','School','Toy'],'Home'],['Animal that gives milk?',['Cow','Lion','Tiger','Fox'],'Cow'],['Waste goes in…',['Dustbin','River','Road','Garden'],'Dustbin']],GK:[['Capital of India?',['New Delhi','Mumbai','Kolkata','Chennai'],'New Delhi'],['Days in a week?',['5','6','7','8'],'7'],['National animal of India?',['Tiger','Lion','Elephant','Horse'],'Tiger'],['Colors in a rainbow?',['5','6','7','8'],'7'],['Red Planet?',['Mars','Earth','Venus','Jupiter'],'Mars'],['Months in a year?',['10','11','12','13'],'12']]};
let profile=JSON.parse(localStorage.lpProfile||'null'),s=JSON.parse(localStorage.lpStats||'{"stars":0,"coins":0,"level":1}'),sub,qs,i,lives,score;
function save(){localStorage.lpStats=JSON.stringify(s);document.querySelector('#stars').textContent=s.stars;document.querySelector('#coins').textContent=s.coins;levels()}function saveProfile(){profile={name:document.querySelector('#name').value.trim()||'दोस्त',grade:document.querySelector('#grade').value};localStorage.lpProfile=JSON.stringify(profile);welcome()}function welcome(){if(profile){name.value=profile.name;grade.value=profile.grade;document.querySelector('#welcome').textContent='नमस्ते '+profile.name+'! '+profile.grade+' के लिए तैयार हो? 🌟'}}function start(x){sub=x;qs=[...D[x]].sort(()=>Math.random()-.5).slice(0,5);i=0;lives=3;score=0;home(false);quiz.classList.remove('hidden');title.textContent=sub;show()}function show(){let a=qs[i];q.textContent=a[0];answers.innerHTML='';feedback.textContent='';nextBtn(false);document.querySelector('#fill').style.width=(i/qs.length*100)+'%';a[1].forEach(v=>{let b=document.createElement('button');b.className='ans';b.textContent=v;b.onclick=()=>answer(b,v);answers.appendChild(b)})}function answer(b,v){[...answers.children].forEach(x=>x.disabled=true);if(v===qs[i][2]){b.classList.add('correct');score++;s.stars++;s.coins+=2;feedback.textContent='✅ सही! +1 ⭐ +2 🪙'}else{b.classList.add('wrong');lives--;feedback.textContent='❌ सही उत्तर: '+qs[i][2];}document.querySelector('#lives').textContent=lives;save();nextBtn(true)}function nextBtn(on){next.classList.toggle('hidden',!on)}function next(){if(lives<=0||i===qs.length-1){finish()}else{i++;show()}}function finish(){if(score>=4)s.level=Math.min(9,s.level+1);save();quiz.classList.add('hidden');result.classList.remove('hidden');resultText.textContent=(profile?profile.name:'दोस्त')+' ने '+score+' / '+qs.length+' सही किए।';badges.innerHTML=score>=4?'<span class="badge">🏅 Super Learner</span><span class="badge">⭐ Stars '+s.stars+'</span>':'<span class="badge">💪 Keep Learning</span>'}function home(showHome=true){quiz.classList.add('hidden');result.classList.add('hidden');if(showHome)homeEl.classList.remove('hidden');progress.classList.remove('hidden')}function levels(){levelsEl.innerHTML='';for(let n=1;n<=9;n++){let b=document.createElement('button');b.className='level '+(n>s.level?'locked':'');b.textContent=(n<=s.level?'🔓 ':'🔒 ')+'Level '+n;b.disabled=n>s.level;levelsEl.appendChild(b)}}
const homeEl=document.querySelector('#home'),quiz=document.querySelector('#quiz'),result=document.querySelector('#result'),progress=document.querySelector('#progress'),next=document.querySelector('#next'),levelsEl=document.querySelector('#levels');welcome();save();if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');
</script></body></html>
