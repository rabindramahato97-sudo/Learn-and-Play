<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1689d7">
<link rel="manifest" href="manifest.json">
<title>Learn & Play</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#dff7ff,#f4ffe9);color:#17243a}
.header{background:#1689d7;color:white;padding:22px 20px 18px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:34px;font-weight:800;line-height:1.0}.score{background:#fff2a8;color:#222;padding:12px 18px;border-radius:22px;font-size:22px}
.wrap{max-width:650px;margin:auto;padding:20px}.card{background:white;border-radius:28px;padding:22px;box-shadow:0 5px 20px #00000012;margin-bottom:18px}
h1,h2{margin-top:0}button,select,input{font:inherit}button{border:0;border-radius:18px;padding:16px 18px;font-weight:700;cursor:pointer}
.primary{background:#1689d7;color:white;width:100%;font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.subject{min-height:120px;font-size:20px}.math{background:#ffd1d9}.eng{background:#cce5ff}.hin{background:#ffe4ad}.evs{background:#d8f6bd}.gk{background:#e5d5ff}
.hidden{display:none}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.pill{background:#eef5ff;padding:8px 12px;border-radius:15px}
.option{display:block;width:100%;margin:10px 0;background:#f2f5f8;text-align:left}.option:active{transform:scale(.99)}
.good{background:#d7f8dc!important}.bad{background:#ffd8d8!important}
.small{color:#64748b}.back{background:#e9eef4}.center{text-align:center}.badge{font-size:50px}
</style>
</head>
<body>
<header class="header"><div class="logo">Learn<br>& Play</div><div class="score">⭐ <span id="stars">0</span></div></header>
<main class="wrap">
<section id="home" class="card">
<h1>👋 Welcome!</h1><p class="small">खेलते-खेलते सीखें • Learn while you play</p>
<label>बच्चे का नाम</label>
<input id="childName" placeholder="नाम लिखें" style="width:100%;padding:14px;border:2px solid #ddd;border-radius:14px;margin:8px 0 14px">
<label>कक्षा चुनें</label>
<select id="classSelect" style="width:100%;padding:14px;border:2px solid #ddd;border-radius:14px;margin:8px 0 18px">
<option>Nursery</option><option>LKG</option><option>UKG</option><option>Class 1</option><option>Class 2</option><option>Class 3</option><option>Class 4</option><option>Class 5</option>
</select>
<button class="primary" onclick="startLearning()" style="margin-bottom:18px">Start Learning 🚀</button>
<div id="level2Panel" class="hidden" style="margin:10px 0 18px">
<div style="font-weight:800;margin-bottom:10px">🔓 Unlocked Level 2</div>
<button id="homeLevel2Btn" class="primary hidden" onclick='start("Maths",2)' style="margin-bottom:8px">🔢 Maths Level 2</button>
<button id="level2_English" class="primary hidden" onclick='start("English",2)' style="margin-bottom:8px">🇬🇧 English Level 2</button>
<button id="level2_Hindi" class="primary hidden" onclick='start("Hindi",2)' style="margin-bottom:8px">🇮🇳 हिन्दी Level 2</button>
<button id="level2_EVS" class="primary hidden" onclick='start("EVS",2)' style="margin-bottom:8px">🌱 EVS Level 2</button>
<button id="level2_GK" class="primary hidden" onclick='start("GK",2)' style="margin-bottom:8px">🌍 GK Level 2</button>
</div>
<p class="small">🔓 Level 2 unlocks for each subject after scoring 6/10 in that subject's Level 1. Each level now has 100 questions.</p>
<div class="grid">
<button class="subject math" onclick="start('Maths')">🔢<br>Maths</button>
<button class="subject eng" onclick="start('English')">🔤<br>English</button>
<button class="subject hin" onclick="start('Hindi')">🪔<br>हिन्दी</button>
<button class="subject evs" onclick="start('EVS')">🌱<br>EVS</button>
<button class="subject gk" onclick="start('GK')">🌎<br>GK</button>
</div>
</section>

<section id="quiz" class="card hidden">
<div class="row"><button class="back" onclick="goHome()">← Back</button><div class="pill">❤️ <span id="lives">3</span> &nbsp; 🪙 <span id="coins">0</span></div></div>
<p class="small" id="levelInfo"></p>
<h2 id="question"></h2>
<div id="options"></div>
<p id="feedback" class="center"></p>
</section>

<section id="result" class="card hidden center">
<div class="badge">🏆</div><h2 id="resultTitle"></h2><p id="resultText"></p>
<button id="continueBtn" class="primary" onclick="continueLearning()">Continue Learning</button>
</section>
</main>

function questionsFor(s){
 if(s==="Maths"){
  const cls=document.getElementById("classSelect").value;
  return currentLevel===2 ? (mathLevel2ByClass[cls]||mathLevel2ByClass["Class 1"]) : (mathByClass[cls]||mathByClass["Class 1"]);
 }
 if(currentLevel===2 && level2Bank[s]) return level2Bank[s];
 const data=bank[s];
 if(data && !Array.isArray(data)) return data[currentLevel] || data[1] || [];
 return data || [];
}
function levelKey(){
 return "lp_unlock_"+document.getElementById("classSelect").value;
}
let subject="",qIndex=0,score=0,lives=3,coins=0,currentLevel=1;
let stars=Number(localStorage.getItem("lp_stars")||0);
document.getElementById("stars").textContent=stars;
document.getElementById("childName").value=localStorage.getItem("lp_name")||"";
document.getElementById("classSelect").value=localStorage.getItem("lp_class")||"Nursery";

function startLearning(){
 localStorage.setItem("lp_name",document.getElementById("childName").value||"");
 const cls=document.getElementById("classSelect");
 if(cls) localStorage.setItem("lp_class", cls.value||"");
 start('Maths');
}

function subjectUnlocked(s){
 return localStorage.getItem("lp_"+s+"_level2")==="1";
}
function unlockSubject(s){
 localStorage.setItem("lp_"+s+"_level2","1");
}
function updateHomeLevel2(){
 const panel=document.getElementById("level2Panel");
 const subjects=["Maths","English","Hindi","EVS","GK"];
 let any=false;
 subjects.forEach(s=>{
  const id=s==="Maths"?"homeLevel2Btn":"level2_"+s;
  const b=document.getElementById(id);
  const ok=subjectUnlocked(s);
  if(b) b.classList.toggle("hidden",!ok);
  if(ok) any=true;
 });
 if(panel) panel.classList.toggle("hidden",!any);
}
function continueLearning(){
 if(currentLevel===1 && subject && subjectUnlocked(subject)) start(subject,2);
 else goHome();
}

function start(s,level=1){
 subject=s;currentLevel=level;qIndex=0;score=0;lives=3;coins=0;
 localStorage.setItem("lp_name",document.getElementById("childName").value||"");
 document.getElementById("home").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 render();
}
function render(){
 const q=questionsFor(subject)[qIndex];
 document.getElementById("levelInfo").textContent=(localStorage.getItem("lp_name")||"बच्चे")+ " • "+document.getElementById("classSelect").value+" • "+subject+" • Level "+currentLevel+" • Question "+(qIndex+1)+"/"+questionsFor(subject).length;
 document.getElementById("question").textContent=q[0];
 document.getElementById("lives").textContent=lives;
 document.getElementById("coins").textContent=coins;
 document.getElementById("feedback").textContent="";
 const box=document.getElementById("options");box.innerHTML="";
 q[1].forEach((a,i)=>{let b=document.createElement("button");b.className="option";b.textContent=a;b.onclick=()=>answer(i,b);box.appendChild(b)});
}
function answer(i,b){
 const q=questionsFor(subject)[qIndex];
 [...document.querySelectorAll(".option")].forEach(x=>x.disabled=true);
 const correct = (typeof q[2] === "number") ? (i===q[2]) : (q[1][i]===q[2]);
 if(correct){
  score++;coins+=(currentLevel===2?20:10);stars++;localStorage.setItem("lp_stars",stars);document.getElementById("stars").textContent=stars;
  b.classList.add("good");document.getElementById("feedback").textContent="🎉 सही जवाब! +⭐ +🪙";
 }else{
  lives--;b.classList.add("bad");document.getElementById("feedback").textContent="😊 कोशिश अच्छी थी!";
 }
 setTimeout(()=>{if(lives<=0||qIndex===questionsFor(subject).length-1) finish();else{qIndex++;render()}},700);
}
function finish(){
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 const total=questionsFor(subject).length;
 const passed=score>=6;
 if(currentLevel===1 && passed) unlockSubject(subject);
 const unlocked=(currentLevel===1 && passed)||subjectUnlocked(subject);
 document.getElementById("resultTitle").textContent=score>=8?"🌟 Excellent!":score>=6?"🎉 Great Job!":"👏 Keep Practising!";
 document.getElementById("resultText").textContent="आपने "+total+" में से "+score+" सही किए। ⭐ Stars: "+stars+" 🪙 Coins: "+coins+(currentLevel===1&&passed?" 🔓 Level 2 Unlocked!":"");
 const old=document.getElementById("level2ResultBtn"); if(old) old.remove();
 if(currentLevel===1 && unlocked){
  const b=document.createElement("button");
  b.id="level2ResultBtn"; b.className="primary"; b.style.marginTop="12px";
  b.textContent="🚀 Play "+subject+" Level 2";
  b.onclick=function(){start(subject,2);};
  document.getElementById("result").appendChild(b);
 }
 updateHomeLevel2();
}
function goHome(){document.getElementById("quiz").classList.add("hidden");document.getElementById("result").classList.add("hidden");document.getElementById("home").classList.remove("hidden");updateHomeLevel2()}
updateHomeLevel2(); window.addEventListener("pageshow",updateHomeLevel2); if("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js");
</script>
